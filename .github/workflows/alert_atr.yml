name: ATR Strategy WeChat Alert

on:
  schedule:
    # 双 cron 兜底：19:00 + 20:00 北京时间各跑一次，单次被跳过另一次能补上
    - cron: '0 11,12 * * *'      # 11:00/12:00 UTC = 19:00/20:00 北京时间
  workflow_dispatch:           # 允许在 Actions 页面手动触发测试

concurrency:
  group: alert-atr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: atr_state.json
          key: atr-state-${{ github.run_id }}
          restore-keys: |
            atr-state-

      - name: Run ATR alert (push to WeChat)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: 'Asia/Shanghai'
        run: python alert_atr.py

      - name: Save alert state
        if: always()
        uses: actions/cache@v4
        with:
          path: atr_state.json
          key: atr-state-${{ github.run_id }}
