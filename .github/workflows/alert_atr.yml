name: ATR Strategy WeChat Alert

on:
  schedule:
    # 双 cron 兜底：19:00 + 20:00 北京时间各跑一次，单次被跳过另一次能补上
    - cron: '0 11,12 * * *'      # 11:00/12:00 UTC = 19:00/20:00 北京时间
  workflow_dispatch:           # 允许在 Actions 页面手动触发测试

concurrency:
  group: alert-atr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ATR alert (push to WeChat)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: 'Asia/Shanghai'
        run: python alert_atr.py

      # H6：状态直接提交回仓库（不再用 actions/cache，避免缓存被淘汰导致状态回落）。
      # [skip ci] 防止该提交触发 Deploy 工作流无限重建页面。
      - name: Commit state back (durable)
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add atr_state.json
          git diff --cached --quiet || git commit -m "chore: persist ATR alert state [skip ci]"
          git pull --rebase origin main || true
          git push
