name: IM-IC Spread WeChat Alert

on:
  schedule:
    # 双 cron 兜底：23:00 + 00:00 北京时间各跑一次，单次被跳过另一次能补上
    - cron: '0 15,16 * * *'      # 15:00/16:00 UTC = 23:00/00:00 北京时间
  workflow_dispatch:

concurrency:
  group: alert-spread
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore spread alert state
        uses: actions/cache/restore@v4
        with:
          path: spread_state.json
          key: spread-state-${{ github.run_id }}
          restore-keys: |
            spread-state-

      - name: Run IM/IC alert (push to WeChat)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: 'Asia/Shanghai'
        run: python alert_spread.py

      - name: Save spread alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: spread_state.json
          key: spread-state-${{ github.run_id }}
